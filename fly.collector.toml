# Fly.io config — CLI Market Collector (background daemon)
# Deploy como app separada:
#   fly apps create cli-market-collector --org <org>
#   fly postgres attach cli-market-db --app cli-market-collector
#   fly secrets set GITHUB_TOKEN=<PAT> --app cli-market-collector
#   fly secrets set COLLECT_PARALLEL=6 COLLECT_DELAY=0.75 --app cli-market-collector
#   fly deploy --app cli-market-collector --config fly.collector.toml

app = "cli-market-collector"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.collector"

  [build.args]
    GITHUB_TOKEN = ""

[env]
  PYTHONUNBUFFERED = "1"
  MARKET_ENV = "production"
  COLLECT_PARALLEL = "6"
  COLLECT_DELAY = "0.75"
  COLLECT_MAX_QUERIES_PER_LINE = "12"
  COLLECT_INTERVAL_HOURS = "4"

# No HTTP service — solo proceso daemon
[processes]
  collector = "python collect_prices.py --daemon"

[[vm]]
  size = "shared-cpu-2x"   # Playwright necesita más CPU
  memory = "1024mb"
  processes = ["collector"]

# Sin health checks HTTP — el collector no expone puerto
# Fly reinicia automáticamente si el proceso muere
[[restart]]
  policy = "always"
  max_retries = 5
