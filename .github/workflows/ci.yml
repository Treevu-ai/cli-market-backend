name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: Treevu-ai/cli-market-index
          ref: 2bfa6d210fc429e1c9c7780d7df9158eb0713a66
          path: .deps/cli-market-index
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "cli-market-core @ git+https://github.com/Treevu-ai/cli-market-core@2d98c0ebc7b17de5d976f76d966997dcb2201dab"
          pip install -e ".deps/cli-market-index[postgres]"
          pip install playwright python-dotenv pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -q -m "not integration"
