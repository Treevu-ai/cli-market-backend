name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test (import modules)
        run: |
          python -c "
          import market_server
          import market_cli
          import collect_prices
          import server_deps
          import index_gate
          print('All 5 modules imported successfully')
          "
