name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: ""
          MARKET_DATA_DIR: /tmp/market_test_ci
          MARKET_LEGACY_CHECKOUT: "1"
          MARKET_API_TOKEN: test-admin-token
        run: pytest tests/ -v --tb=short
