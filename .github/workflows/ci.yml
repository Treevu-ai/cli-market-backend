name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          grep -v "cli-market-core" requirements.txt > /tmp/reqs-ci.txt
          pip install -r /tmp/reqs-ci.txt

      - name: Run tests
        run: pytest tests/ -q -m "not integration"
