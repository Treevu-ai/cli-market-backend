[project]
name = "cli-market-backend"
# Versioned independently from cli-market-core/cli-market-world — this is a
# deployed service, not a published package, so it does not need to track
# their release cadence.
version = "1.0.1"
description = "CLI Market backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "ops*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.json", "*.toml"]
