# Railway config for the API service (FastAPI)
#
# COLLECTOR is a separate Railway service — use railway.collector.toml:
#   Settings → Config-as-code → Config file path → /railway.collector.toml
#
# Add PostgreSQL from Railway dashboard → auto-injects DATABASE_URL
#
# Required build variable (secret) on this service (either name works):
#   GITHUB_TOKEN or GH_TOKEN — GitHub PAT with repo read on Treevu-ai/cli-market-index
# After bumping cli-market-core on PyPI, wait ~2 min before pushing backend (pip race).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
numReplicas = 1