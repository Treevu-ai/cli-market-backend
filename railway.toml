# Railway config for the API service (FastAPI)
#
# COLLECTOR is a separate Railway service — use railway.collector.toml:
#   Settings → Config-as-code → Config file path → /railway.collector.toml
#
# Add PostgreSQL from Railway dashboard → auto-injects DATABASE_URL

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
numReplicas = 1

# Required build-time variable (private git deps in requirements.txt):
#   GITHUB_TOKEN=<fine-grained or classic PAT with read access to Treevu-ai/*>
#   Enable "Available at Build Time" in Railway → Variables.