# Railway config for the COLLECTOR service (background worker).
#
# In Railway Dashboard → collector service → Settings → Config-as-code:
#   Config file path: /railway.collector.toml
#
# Do NOT use the root railway.toml on this service — that file is for the API.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.collector"
# The data-moat modules now live in cli-market-core (pinned in requirements.txt),
# so a core bump = a requirements.txt change = a collector redeploy.
watchPatterns = [
  "collect_prices.py",
  "requirements.txt",
  "requirements-private.txt",
  "Dockerfile.collector",
  "railway.collector.toml",
]

[deploy]
restartPolicyType = "ON_FAILURE"
numReplicas = 1

# Required build variable (secret) on this service (either name works):
#   GITHUB_TOKEN or GH_TOKEN — GitHub PAT with repo read on Treevu-ai/cli-market-index
#
# Suggested runtime variables on this service:
#   DATABASE_URL=${{Postgres.DATABASE_URL}}
#   COLLECT_PARALLEL=6
#   COLLECT_DELAY=0.75
#   COLLECT_MAX_QUERIES_PER_LINE=12
#   COLLECT_INTERVAL_HOURS=4